name: Build AORC AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and locate Flutter project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./extracted/*" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d extracted
          fi

          PROJECT_FILE=$(find extracted . \
            -type f -name pubspec.yaml \
            ! -path "./.git/*" \
            ! -path "./extracted/.git/*" \
            -print -quit 2>/dev/null || true)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: pubspec.yaml not found."
            echo "Upload the project ZIP or commit the Flutter project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter installation
        run: |
          flutter --version
          dart --version

      - name: Fix launcher icon configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          text = p.read_text()

          start = text.find("dev_dependencies:")
          end = text.find("\nflutter:", start)

          if start == -1 or end == -1:
              raise SystemExit(
                  "Could not locate dev_dependencies/flutter sections"
              )

          replacement = """dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
            flutter_launcher_icons: ^0.14.1

          flutter_launcher_icons:
            android: "ic_launcher"
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 21
            adaptive_icon_background: "#F6EDD6"
            adaptive_icon_foreground: "assets/icon_fg.png"
          """

          p.write_text(text[:start] + replacement + text[end:])
          print("Updated pubspec.yaml")
          PY

          echo "Checking required assets..."
          test -f assets/icon.png
          test -f assets/icon_fg.png

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          if [ ! -f android/gradlew ]; then
            flutter create . \
              --platforms=android \
              --project-name aorc_ai \
              --org com.aorc
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Patch Android configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f tools/patch_manifest.py ]; then
            python3 tools/patch_manifest.py
          else
            echo "No Android patch script found; skipping."
          fi

      - name: Generate launcher icons
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          dart run flutter_launcher_icons

      - name: Analyze Dart code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-pub

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aorc-ai-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
