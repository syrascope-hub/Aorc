name: AORC AI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build AORC AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install tools and Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip python3

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Find and extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          if [ -f "$ROOT/pubspec.yaml" ]; then
            PROJECT_DIR="$ROOT"
          elif [ -f "$ROOT/aorc_ai/pubspec.yaml" ]; then
            PROJECT_DIR="$ROOT/aorc_ai"
          else
            ZIP_FILE="$(find "$ROOT" -maxdepth 3 \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No ZIP file or Flutter project found."
              exit 1
            fi

            mkdir -p "$ROOT/_build_source"
            unzip -o "$ZIP_FILE" -d "$ROOT/_build_source"

            PUBSPEC="$(find "$ROOT/_build_source" \
              -type f -name pubspec.yaml \
              -not -path '*/.dart_tool/*' \
              -print -quit)"

            if [ -z "$PUBSPEC" ]; then
              echo "::error::No pubspec.yaml found inside ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Fix PixelBar import
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          source_file = root / "lib" / "dictation.dart"
          progress_file = root / "lib" / "progress.dart"

          if not source_file.exists():
              print("dictation.dart not found; skipping.")
              raise SystemExit(0)

          source = source_file.read_text(encoding="utf-8")

          if "PixelBar(" in source and \
             "import 'progress.dart';" not in source:

              if not progress_file.exists():
                  raise SystemExit(
                      "PixelBar import cannot be fixed: progress.dart is missing."
                  )

              progress = progress_file.read_text(encoding="utf-8")

              if "class PixelBar" not in progress:
                  raise SystemExit(
                      "PixelBar class was not found in progress.dart."
                  )

              anchor = "import 'common.dart';"

              if anchor not in source:
                  raise SystemExit(
                      "Cannot safely insert the PixelBar import."
                  )

              source = source.replace(
                  anchor,
                  anchor + "\nimport 'progress.dart';",
                  1,
              )

              source_file.write_text(source, encoding="utf-8")

          print("PixelBar import check completed.")
          PY

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            flutter create \
              --platforms=android \
              --project-name aorc_ai \
              --org com.aorc \
              .
          fi

          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Android Gradle wrapper is missing."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Fix Android compile SDK and JVM targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          pub_cache = Path(
              os.environ.get(
                  "PUB_CACHE",
                  str(Path.home() / ".pub-cache")
              )
          )

          roots = [project / "android"]

          if pub_cache.exists():
              roots.append(pub_cache)

          files = set()

          for root in roots:
              if not root.exists():
                  continue

              files.update(root.rglob("build.gradle"))
              files.update(root.rglob("build.gradle.kts"))

          marker = "AORC_CI_COMPILE_SDK_36"

          patched = []
          file_picker_seen = False

          for gradle_file in sorted(files):
              try:
                  source = gradle_file.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  continue

              if not re.search(r"(?m)^\s*android\s*\{", source):
                  continue

              path_lower = str(gradle_file).lower()

              if "file_picker-" in path_lower:
                  file_picker_seen = True

              if marker in source:
                  patched.append(str(gradle_file))
                  continue

              uses_kotlin = bool(
                  re.search(
                      r"kotlin|org\.jetbrains\.kotlin",
                      source,
                      re.IGNORECASE,
                  )
              )

              if gradle_file.name == "build.gradle.kts":
                  block = f"""

          // {marker}
          android {{
              compileSdk = 36

              compileOptions {{
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }}
          }}
          """

                  if uses_kotlin:
                      block += """
          android {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """
              else:
                  block = f"""

          // {marker}
          android {{
              compileSdkVersion 36

              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}
          }}
          """

                  if uses_kotlin:
                      block += """
          android {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """

              gradle_file.write_text(
                  source.rstrip() + "\n" + block + "\n",
                  encoding="utf-8",
              )

              patched.append(str(gradle_file))
              print(f"Patched: {gradle_file}")

          if not file_picker_seen:
              raise SystemExit(
                  "Could not find file_picker Gradle file in the project "
                  "or Pub cache."
              )

          print(f"Patched or verified {len(patched)} Android Gradle files.")
          PY

      - name: Patch Android manifest if required
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f tools/patch_manifest.py ]; then
            python3 tools/patch_manifest.py
          else
            echo "No custom manifest patch script; continuing."
          fi

      - name: Remove obsolete template test
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f test/widget_test.dart ] && \
             grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
            echo "Removed outdated MyApp widget test."
          fi

      - name: Generate launcher icons
        shell: bash
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          dart run flutter_launcher_icons

      - name: Analyze Dart code
        shell: bash
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/aorc-ai.apk"

          ls -lh "$GITHUB_WORKSPACE/dist/aorc-ai.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/aorc-ai.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: AORC-AI-APK
          path: dist/aorc-ai.apk
          if-no-files-found: error
          retention-days: 14
