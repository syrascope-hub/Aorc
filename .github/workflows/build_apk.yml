name: AORC AI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP and locate project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No ZIP or Flutter project found."
              exit 1
            fi

            mkdir -p "$GITHUB_WORKSPACE/_build_source"
            unzip -o "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/_build_source"

            PUBSPEC="$(find "$GITHUB_WORKSPACE/_build_source" \
              -type f -name pubspec.yaml -print -quit)"

            if [ -z "$PUBSPEC" ]; then
              echo "::error::No pubspec.yaml found inside ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Located project: $PROJECT_DIR"

      - name: Fix missing PixelBar import
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          file = root / "lib" / "dictation.dart"

          if file.exists():
              text = file.read_text(encoding="utf-8")

              if "PixelBar(" in text and \
                 "import 'progress.dart';" not in text:
                  anchor = "import 'common.dart';"

                  if anchor not in text:
                      raise SystemExit(
                          "Cannot safely fix PixelBar import."
                      )

                  text = text.replace(
                      anchor,
                      anchor + "\nimport 'progress.dart';",
                      1,
                  )
                  file.write_text(text, encoding="utf-8")
                  print("Added progress.dart import.")
          PY

      - name: Generate Android project if required
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            flutter create \
              --platforms=android \
              --project-name aorc_ai \
              --org com.aorc \
              .
          fi

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      - name: Remove outdated default widget test
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f test/widget_test.dart ] && \
             grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
            echo "Removed stale MyApp template test."
          fi

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Patch Android manifest and desugaring
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f tools/patch_manifest.py ]; then
            python3 tools/patch_manifest.py
          else
            echo "::notice::No custom manifest patch script found."
          fi

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          cat > android/ci-kotlin-target.gradle <<'GRADLE'
          subprojects {
              tasks.configureEach { task ->
                  if (task.name.startsWith("compile") &&
                      task.name.endsWith("Kotlin")) {
                      task.kotlinOptions.jvmTarget = "11"
                  }
              }
          }
          GRADLE

          python3 - <<'PY'
          from pathlib import Path

          android = Path("android")
          groovy = android / "build.gradle"
          kotlin = android / "build.gradle.kts"

          if groovy.exists():
              target = groovy
              line = 'apply from: "$rootDir/ci-kotlin-target.gradle"'
          elif kotlin.exists():
              target = kotlin
              line = 'apply(from = "$rootDir/ci-kotlin-target.gradle")'
          else:
              raise SystemExit(
                  "Android root build.gradle(.kts) not found."
              )

          text = target.read_text(encoding="utf-8")
          if "ci-kotlin-target.gradle" not in text:
              target.write_text(
                  text.rstrip() + "\n\n" + line + "\n",
                  encoding="utf-8",
              )

          print(f"JVM target alignment enabled in {target}")
          PY

      - name: Generate launcher icons
        shell: bash
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          dart run flutter_launcher_icons

      - name: Analyze Dart code
        shell: bash
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-pub \
            --no-fatal-infos \
            --no-fatal-warnings

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/aorc-ai.apk"

          ls -lh "$GITHUB_WORKSPACE/dist/aorc-ai.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/aorc-ai.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AORC-AI-APK
          path: dist/aorc-ai.apk
          if-no-files-found: error
          retention-days: 14
