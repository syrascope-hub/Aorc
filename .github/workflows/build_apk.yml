name: AORC AI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract, Fix JVM Targets and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3

      - name: Find or extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [ -f "$GITHUB_WORKSPACE/aorc_ai/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/aorc_ai"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo '::error::No pubspec.yaml or ZIP file was found.'
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print | head -200
              exit 1
            fi

            mkdir -p "$GITHUB_WORKSPACE/_build_source"
            unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_build_source"

            PUBSPEC="$(find "$GITHUB_WORKSPACE/_build_source" \
              -type f -name pubspec.yaml -not -path '*/.dart_tool/*' \
              -print -quit)"

            if [ -z "$PUBSPEC" ]; then
              echo '::error::The ZIP does not contain a Flutter pubspec.yaml.'
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo '::error::Flutter project directory is invalid.'
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Flutter project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Fix PixelBar import in dictation screen
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ['PROJECT_DIR'])
          dart_file = project / 'lib' / 'dictation.dart'
          progress_file = project / 'lib' / 'progress.dart'

          if not dart_file.exists():
              print('dictation.dart not present; skipping PixelBar import patch.')
              raise SystemExit(0)

          text = dart_file.read_text(encoding='utf-8')
          if 'PixelBar(' in text and "import 'progress.dart';" not in text:
              if not progress_file.exists() or 'class PixelBar' not in progress_file.read_text(encoding='utf-8'):
                  raise SystemExit('PixelBar is used, but lib/progress.dart does not define it.')

              anchor = "import 'common.dart';"
              if anchor not in text:
                  raise SystemExit('Could not safely insert the PixelBar import.')

              text = text.replace(anchor, anchor + "\nimport 'progress.dart';", 1)
              dart_file.write_text(text, encoding='utf-8')
              print('Fixed missing import for PixelBar.')
          else:
              print('PixelBar import does not need a change.')
          PY

      - name: Generate Android project files if missing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            flutter create \
              --platforms=android \
              --project-name aorc_ai \
              --org com.aorc \
              .
          fi

          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo '::error::Android Gradle wrapper was not generated.'
            exit 1
          fi

          chmod +x android/gradlew

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Align Java and Kotlin targets in Android plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          cache = Path(os.environ.get('PUB_CACHE', str(Path.home() / '.pub-cache')))
          if not cache.exists():
              raise SystemExit(f'Pub cache does not exist: {cache}')

          kotlin_plugin_pattern = re.compile(
              r'kotlin-android|org\.jetbrains\.kotlin\.android|'
              r'org\.jetbrains\.kotlin\.multiplatform|kotlin\(["\']android["\']\)',
              re.IGNORECASE,
          )
          required_plugin_prefixes = (
              'audioplayers_android-',
              'flutter_timezone-',
              'flutter_tts-',
          )

          groovy_block = r'''

          // AORC_CI_JVM_TARGET_17: keep Java and Kotlin bytecode targets consistent.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          '''

          kts_block = r'''

          // AORC_CI_JVM_TARGET_17: keep Java and Kotlin bytecode targets consistent.
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          '''

          patched = []
          patched_required = set()

          for gradle_file in cache.rglob('build.gradle'):
              if gradle_file.parent.name != 'android':
                  continue
              try:
                  source = gradle_file.read_text(encoding='utf-8')
              except (OSError, UnicodeError):
                  continue

              package_name = gradle_file.parent.parent.name
              required = next(
                  (prefix for prefix in required_plugin_prefixes if package_name.startswith(prefix)),
                  None,
              )

              if 'AORC_CI_JVM_TARGET_17' in source:
                  if required:
                      patched.append(str(gradle_file))
                      patched_required.add(required)
                  continue

              if not kotlin_plugin_pattern.search(source) and not required:
                  continue

              if not re.search(r'(?m)^\s*android\s*\{', source):
                  print(f'Skipping Kotlin module without an android block: {gradle_file}')
                  continue

              gradle_file.write_text(source.rstrip() + groovy_block + '\n', encoding='utf-8')
              patched.append(str(gradle_file))
              if required:
                  patched_required.add(required)
                  print(f'Patched required plugin: {package_name}')

          for gradle_file in cache.rglob('build.gradle.kts'):
              if gradle_file.parent.name != 'android':
                  continue
              try:
                  source = gradle_file.read_text(encoding='utf-8')
              except (OSError, UnicodeError):
                  continue

              package_name = gradle_file.parent.parent.name
              required = next(
                  (prefix for prefix in required_plugin_prefixes if package_name.startswith(prefix)),
                  None,
              )

              if 'AORC_CI_JVM_TARGET_17' in source:
                  if required:
                      patched.append(str(gradle_file))
                      patched_required.add(required)
                  continue

              if not kotlin_plugin_pattern.search(source) and not required:
                  continue

              if not re.search(r'(?m)^\s*android\s*\{', source):
                  print(f'Skipping Kotlin module without an android block: {gradle_file}')
                  continue

              gradle_file.write_text(source.rstrip() + kts_block + '\n', encoding='utf-8')
              patched.append(str(gradle_file))
              if required:
                  patched_required.add(required)
                  print(f'Patched required plugin: {package_name}')

          if not any(name.startswith('audioplayers_android-') for name in [Path(p).parent.parent.name for p in patched]):
              raise SystemExit('audioplayers_android was not patched. Refusing to run a build with the known JVM target mismatch.')

          if not patched:
              raise SystemExit('No Kotlin Android plugin Gradle scripts were patched. Check the Pub cache and plugin layout.')

          print(f'Patched or verified {len(patched)} Kotlin Android Gradle script(s).')
          for path in patched:
              print(f'  {path}')
          PY

      - name: Patch Android manifest and desugaring
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f tools/patch_manifest.py ]; then
            python3 tools/patch_manifest.py
          else
            echo '::notice::No custom Android manifest patch script found; continuing.'
          fi

      - name: Remove stale generated widget test
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
            echo 'Removed obsolete Flutter template test referring to MyApp.'
          fi

      - name: Generate launcher icons
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          dart run flutter_launcher_icons

      - name: Analyze Dart code (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo '::error::APK was not generated.'
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/aorc-ai.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/aorc-ai.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/aorc-ai.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: AORC-AI-APK
          path: dist/aorc-ai.apk
          if-no-files-found: error
          retention-days: 14
